<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Digital Memory Capsule - Write a message for your future self.">

    <title>Digital Memory Capsule</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="memory-card">

            <header class="header">
                <h1>Digital Memory Capsule</h1>
                <p>Write a message for your future self.</p>
            </header>

            <div class="form-section">

                <!-- Message -->
                <label for="message">Write Your Message:</label>

                <textarea
                    id="message"
                    name="message"
                    rows="8"
                    maxlength="500"
                    placeholder="Write something you want your future self to remember..."
                    required></textarea>

                <div class="character-count">
                    <span id="charCount">0</span>/500 characters
                </div>

                <!-- Unlock Date -->
                <label for="date">Choose Unlock Date:</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required>

                <!-- Save Button -->
                <button
                    type="button"
                    onclick="saveCapsule()">
                    Save Capsule
                </button>

                <!-- Result -->
                <div id="result" class="result"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

    <script>
        // Character counter
        const messageBox = document.getElementById("message");
        const charCount = document.getElementById("charCount");

        messageBox.addEventListener("input", function () {
            charCount.textContent = messageBox.value.length;
        });

        // Prevent selecting a past date
        const dateInput = document.getElementById("date");

        const today = new Date().toISOString().split("T")[0];

        dateInput.min = today;
    </script>

</body>

</html>
