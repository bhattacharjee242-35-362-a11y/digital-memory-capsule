<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Memory Capsule</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Digital Memory Capsule</h1>

    <p>Write a message for your future self.</p>

    <label>Write Your Message:</label>

    <br><br>

    <textarea id="message" rows="8" cols="50"></textarea>

    <br><br>

    <label>Choose Unlock Date:</label>

    <br><br>

    <input type="date" id="date">

    <br><br>

    <button onclick="saveCapsule()">Save Capsule</button>

    <div id="result"></div>


    <script src="script.js"></script>

</body>

</html>
